name: Fix PR 1550 rebase formatting

on:
  push:
    branches:
      - rebase-1550

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebase-1550
      - name: Restore final newline and clean temporary workflows
        shell: python
        run: |
          from pathlib import Path

          menu = Path("crates/ui-egui/src/menus.rs")
          data = menu.read_bytes()
          if not data.endswith(b"\n"):
              menu.write_bytes(data + b"\n")

          for workflow in [
              Path(".github/workflows/fix-rebase-1550-format.yml"),
              Path(".github/workflows/validate-rebase-1550.yml"),
          ]:
              if workflow.exists():
                  workflow.unlink()
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: format rebased Help menu changes"
          git push origin HEAD:rebase-1550
